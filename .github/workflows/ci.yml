name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:
  update-readme:
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Añadir línea de nueva feature al README
        run: |
          echo "- Nueva feature añadida" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: actualizar README con nueva feature [skip ci]" || exit 0
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar token de desarrollo
        shell: bash
        env:
          DEV_TOKEN_SECRET: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN_SECRET" = "$LOCAL_DEV_TOKEN" ]; then
            echo "DEV_TOKEN coincide correctamente."
            exit 0
          else
            echo "ERROR: DEV_TOKEN NO coincide."
            exit 1
          fi